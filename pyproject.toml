[project]
name = "sre-agent"
version = "0.1.0"
description = "Production-grade, extensible SRE Agent Platform using ADK 2.0 and MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "google-adk[agent-identity]>=0.1.0",
    "google-genai>=1.75.0",
    "google-cloud-aiplatform[agent-engines]>=1.130.0",
    "google-cloud-privilegedaccessmanager>=0.4.1",
    "a2a-sdk>=0.3.26,<1.0.0",
    "python-dotenv>=1.0.1",
    "pydantic>=2.0.0",
    "requests>=2.31.0",
    "fastapi>=0.110.0",
    "uvicorn>=0.28.0",
    "mcp"
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
